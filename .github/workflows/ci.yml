name: CI

# Runs vet + the test suite + a cross-compile probe on every push and PR.
# The point is to catch the kind of regressions a solo committer can miss:
# - a package import that breaks builds on Linux
# - a test that passes on the author's laptop but fails on a fresh clone
# - the ARM cross-compile silently breaking after a CGo dep sneaks in
#
# Times out at 10 minutes — way more than `go test ./...` needs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -timeout 60s -race ./...

      - name: cross-compile picapture (ARMv7)
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: '7'
        run: go build -trimpath -ldflags="-s -w" -o /tmp/picapture_arm32 ./cmd/picapture

      - name: cross-compile picapture (ARM64)
        env:
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -ldflags="-s -w" -o /tmp/picapture_arm64 ./cmd/picapture

      - name: host build (all binaries)
        run: |
          go build -o /tmp/gatemanai  ./cmd/gatemanai
          go build -o /tmp/mcpserver  ./cmd/mcpserver
          go build -o /tmp/doctor     ./cmd/doctor
          go build -o /tmp/allow      ./cmd/allow
          go build -o /tmp/rtspsource ./cmd/rtspsource
